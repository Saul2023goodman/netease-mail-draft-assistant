name: CSS cleanup round 3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune dead legacy CSS
        run: python3 .github/scripts/prune-css-round3.py

      - name: Verify and self-clean
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/prune-css-round3.py .github/workflows/css-cleanup-round3.yml
          git add -A
          git commit -m "refactor: remove dead legacy UI styles"
          git push origin HEAD:main
