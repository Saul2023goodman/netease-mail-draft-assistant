name: CSS cleanup round 3

on:
  push:
    branches:
      - refactor/css-legacy-cleanup-round3

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune dead legacy CSS
        run: python3 .github/scripts/prune-css-round3.py

      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css
          git commit -m "refactor: remove dead legacy UI styles"
          git push origin HEAD:refactor/css-legacy-cleanup-round3
