name: Core CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: npm test
      - name: Standalone Chrome bootstrap smoke
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary on runner"
            exit 1
          fi
          OUT="$(mktemp)"
          ERR="$(mktemp)"
          set +e
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --disable-component-update --disable-default-apps --no-first-run --allow-file-access-from-files --dump-dom "file://$PWD/app.html" > "$OUT" 2> "$ERR"
          STATUS=$?
          set -e
          if [ ! -s "$OUT" ]; then
            echo "Chrome produced no DOM (exit $STATUS)"
            cat "$ERR"
            exit 1
          fi
          grep -q 'id="nmda-root"' "$OUT"
          grep -q 'id="nmda-panel"' "$OUT"
          if grep -E 'id="nmda-panel"[^>]*hidden' "$OUT"; then
            echo "Standalone workbench panel remained hidden after bootstrap"
            cat "$OUT"
            exit 1
          fi
          if ! grep -E 'id="nmda-launcher"[^>]*hidden' "$OUT"; then
            echo "Standalone launcher was not hidden after panel bootstrap"
            cat "$OUT"
            exit 1
          fi
