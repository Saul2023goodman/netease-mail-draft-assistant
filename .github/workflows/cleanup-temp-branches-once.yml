name: Remove temporary refactor branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete temporary branches
        run: |
          set -euo pipefail
          for branch in \
            refactor/css-legacy-cleanup-round3 \
            refactor/prune-dead-css-round3 \
            refactor/prune-legacy-redundancy \
            refactor/prune-runtime-legacy-round2 \
            refactor/runtime-legacy-cleanup-round2 \
            cleanup/remove-temp-branches
          do
            git push origin --delete "$branch" || true
          done

      - name: Remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-temp-branches-once.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:main
