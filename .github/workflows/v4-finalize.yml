name: v4-finalize

on:
  push:
    branches:
      - refactor/v4-task-lifecycle

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v4-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v4-task-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Finalize policy sources
        run: node scripts/apply-v4-cleanup.mjs
      - name: Syntax check
        run: |
          node --check app.js
          node --check workflow-unifier.js
          node --check scheduler.js
          node --check roster-v2.js
          node --check default-policy.js
          node --check policy-profile.js
          node --check policy-bridge.js
      - name: Tests
        run: npm test
      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-unifier.js
          git commit -m "refactor: centralize follow-up defaults [v4-finalize]"
          git push origin HEAD:refactor/v4-task-lifecycle
